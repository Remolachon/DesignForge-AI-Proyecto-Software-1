name: 🚀 CI/CD Pipeline Unificado

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ==========================================
  # 1. TESTS Y COBERTURA (BACKEND & FRONTEND)
  # ==========================================
  test-backend:
    name: 🐍 Test & Coverage Backend (80%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Lint con flake8
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🧪 Ejecutar pruebas y validar 80% de cobertura
        env:
          TESTING: "true"
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'sqlite:///./test.db' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://test.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'test-key' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.SECRET_KEY || 'test-secret-key' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pytest tests/ --cov=app --cov-fail-under=80

  test-frontend:
    name: ⚛️ Test & Coverage Frontend (80%)
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    defaults:
      run:
        working-directory: frontend
    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Lint con ESLint
        run: npm run lint

      - name: 🔎 Verificar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: 🧪 Ejecutar pruebas y validar 80% de cobertura (Vitest)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run test:coverage

      - name: 🏗️ Build de verificación
        run: npm run build

  # ==========================================
  # 2. DEPLOY A PRODUCCIÓN (RENDER & VERCEL)
  # ==========================================
  deploy-backend:
    name: 🚀 Deploy Backend -> Render
    runs-on: ubuntu-latest
    needs: test-backend # DEPENDE ESTRICTAMENTE DE TESTS DEL BACKEND
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: 🚀 Trigger deploy en Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Accept: application/json"

      - name: ⏱️ Esperar y verificar salud del backend
        run: |
          echo "Esperando 60s para que Render arranque el servidor..."
          sleep 60
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://designforge-ai-proyecto-software-1.onrender.com/docs)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ El backend no respondió correctamente (status $STATUS)"
            exit 1
          fi
          echo "✅ Backend en producción OK"

  deploy-frontend:
    name: 🚀 Deploy Frontend -> Vercel
    runs-on: ubuntu-latest
    needs: [test-frontend, deploy-backend] # DEPENDE DE TESTS FRONTEND Y DEPLOY BACKEND
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: ⚙️ Pull configuración de Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: 🏗️ Build en Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: 🚀 Deploy a producción en Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: ✅ Deploy completado
        run: echo "🚀 Frontend desplegado en https://design-forge-ai-proyecto-software-1-wheat.vercel.app"
